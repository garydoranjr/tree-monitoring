# Radiometric configuration for the globus 50ha RGB mosaics
# (/scratch/tree-monitoring/stri/globus/RGB).
#
# These mosaics are 4-band uint16, whereas the SegFormer flowering/deciduous
# models were trained on 8-bit chips derived from the uint8 mosaics in
# /scratch/tree-monitoring/stri/24782016/BCI_50ha_timeseries_global_alignment.
# Feeding the raw uint16 data to the model fails outright (PIL cannot build an
# RGB image from uint16), and a plain >>8 shift lands well outside the training
# domain — the blue band in particular sits at a median of 0.21 instead of 0.40.
#
# The gains/offsets below map uint16 DN -> uint8 by matching each band's 2nd and
# 98th percentile to the corresponding percentile of the uint8 reference set,
# fitted over ~63M valid pixels sampled from 24 dates of each dataset. This cuts
# the mean per-band histogram distance (mean |CDF difference|) from 0.146 to
# 0.033, a 4.5x improvement over >>8.
#
# The coefficients are deliberately FIXED rather than recomputed per image or
# per crown window. The p98 anchors are stable across dates (CV 0.03-0.07) while
# p2 is not (CV 0.65-0.86), and an adaptive per-window stretch would renormalize
# every crown by its own percentiles — erasing the ~12% genuine cross-crown
# brightness variation that a flowering detector depends on, and making each
# date's normalization a function of that date's scene content. A single fixed
# transform keeps the time series mutually comparable.
#
# Note that band 4 is ignored entirely. In the globus mosaics it is a {0, 65535}
# alpha channel; in the uint8 reference set the same band instead carries
# photogrammetric height (values 3-196, only r=0.20 with RGB brightness) despite
# its GeoTIFF colour interpretation claiming alpha. Only bands 1-3 (R, G, B) are
# ever passed to the model.

# Scaling applied as: uint8 = clip(round(DN * gain + offset), 0, 255)
# One entry per band, in R, G, B order.
uint16_to_uint8:
  - gain: 0.00409685    # red    (ref p2/p98 = 25/225, globus = 301/49119)
    offset: 23.7668
  - gain: 0.00375804    # green  (ref p2/p98 = 41/238, globus = 2830/55251)
    offset: 30.3648
  - gain: 0.00424811    # blue   (ref p2/p98 = 28/186, globus = 1/37194)
    offset: 27.9958

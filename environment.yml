# conda env create -f environment.yml
#
# torch/torchvision come from pip (below), NOT conda-forge: the conda-forge
# osx-arm64 builds are CPU-only (no compiled MPS kernels), so ops like
# torchvision::nms / roi_align raise NotImplementedError on the MPS device.
# The official PyPI arm64 wheels ship the MPS kernels. torchmetrics and
# pycocotools are pip-installed too, otherwise conda would pull the
# conda-forge (CPU-only) pytorch back in to satisfy their dependency.
#
# Apple Silicon post-create step: the pip torch wheel bundles its own
# libomp.dylib, which collides with conda's llvm-openmp at import time
# (OMP: Error #15). Point torch at the single conda copy so only one
# OpenMP runtime loads:
#   ln -sf ../../../../libomp.dylib \
#     "$CONDA_PREFIX/lib/python3.12/site-packages/torch/lib/libomp.dylib"
name: flower
channels:
  - conda-forge
dependencies:
  - python=3.12
  - xarray
  - matplotlib
  - cartopy
  - numpy
  - requests
  - pandas
  - rioxarray
  - rasterio
  - tqdm
  - scikit-learn
  - scikit-image
  - geopandas
  - Pillow
  - click
  - arosics
  - planet
  - werkzeug
  - dash
  - plotly
  - wandb
  - pip:
      - torch==2.12.0
      - torchvision==0.27.0
      - torchmetrics
      - pycocotools
      - python-ffmpeg
